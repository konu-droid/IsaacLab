seed: 42


# Models
# The custom networks (defined in custom_network.py) are wired in by CustomRunner.
# `class` here selects the custom model classes instead of skrl's YAML model-instantiator.
models:
  separate: True
  policy:  # CustomGaussianPolicy
    class: CustomGaussian
    hidden_sizes: [32, 32]
    activation: elu
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
  value:  # CustomDeterministicValue
    class: CustomDeterministic
    hidden_sizes: [32, 32]
    activation: elu
    clip_actions: False


# Rollout memory
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
memory:
  class: RandomMemory
  memory_size: -1  # automatically determined (same as agent:rollouts)


# Custom PPO agent configuration (CustomPPO; field names extend PPO_DEFAULT_CONFIG)
agent:
  class: CustomPPO
  rollouts: 32
  learning_epochs: 8
  mini_batches: 8
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 5.0e-04
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.008
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.0
  value_loss_scale: 2.0
  kl_threshold: 0.0
  rewards_shaper_scale: 0.1
  time_limit_bootstrap: False
  # --- custom loss knobs (read by CustomPPO) ---
  value_loss_type: huber       # "mse" or "huber"
  behavior_reg_scale: 0.0      # action-magnitude regularization weight (0 disables)
  # logging and checkpoint
  experiment:
    directory: "lerobot_ts_pnp_direct"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto


# Sequential trainer
# https://skrl.readthedocs.io/en/latest/api/trainers/sequential.html
trainer:
  class: SequentialTrainer
  timesteps: 4800
  environment_info: log
